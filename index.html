<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a0e1f;--c1:#111733;--c2:#161d40;--bd:#242c57;--p:#8b5cf6;--p2:#a78bfa;--t:#e8ebff;--t2:#8e97c4;--r:16px;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1{font-size:1.25rem;margin:0;font-weight:700}h2{font-size:1.05rem;margin:22px 0 10px}h3{margin:0 0 14px}
small{color:var(--t2);display:block;font-size:.8rem}
label{display:block;font-size:.8rem;color:var(--t2);margin:6px 0}
.w{max-width:520px;margin:0 auto;padding:16px 16px 170px}
.hd,.top,.rw{display:flex;align-items:center;gap:12px}
.hd,.top{margin-bottom:18px}
.fl{flex:1;min-width:0}
.logo,.ico{width:44px;height:44px;border-radius:14px;background:rgba(139,92,246,.18);color:var(--p);display:grid;place-items:center;flex:none}
.ib{background:var(--c2);border:1px solid var(--bd);color:var(--t);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{background:var(--c1);border:1px solid var(--bd);border-radius:var(--r);padding:12px}.sc b{font-size:1.6rem;color:var(--p2);display:block}.sc small{font-size:.72rem}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:.2s}
.col{display:block}
.lc{cursor:pointer}.lc b,.it b{display:block}
.pc{display:flex;align-items:center;gap:4px;color:var(--p2);font-weight:600;font-size:.9rem}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px;transition:width .4s}
.it{background:var(--c2)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--bd);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.dn .ck{background:var(--p);border-color:var(--p)}.dn b{text-decoration:line-through;color:var(--t2)}.dn{opacity:.6}
.em{font-size:1.4rem}
img.logo{width:54px;height:54px;border-radius:14px;background:none;object-fit:cover}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--p);color:#fff;font:600 1rem Inter,system-ui,sans-serif;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;margin-top:10px}
.btn.ghost{background:var(--c2);color:var(--t);border:1px solid var(--bd)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:488px;margin:0;box-shadow:0 8px 24px rgba(139,92,246,.4);z-index:4}
.in{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--c2);color:var(--t);font:16px Inter,system-ui,sans-serif;margin-bottom:10px}
textarea.in{min-height:150px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px 0 14px;padding-bottom:4px}
.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--c2);color:var(--t2);border-radius:20px;padding:7px 14px;cursor:pointer;font:500 .85rem Inter,system-ui,sans-serif}
.chips .on{background:var(--p);border-color:var(--p);color:#fff}
.pb{border:1px solid var(--bd);background:var(--c2);color:var(--p2);border-radius:10px;padding:8px 12px;font:600 .8rem Inter,system-ui,sans-serif;cursor:pointer}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--c1);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#nav button{flex:1;max-width:110px;border:0;background:none;color:var(--t2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;font:500 .7rem Inter,system-ui,sans-serif;cursor:pointer}
#nav .on{color:var(--p);background:rgba(139,92,246,.15)}
.ov{position:fixed;inset:0;background:rgba(5,8,20,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--c1);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mi{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border:0;background:var(--c2);color:var(--t);border-radius:12px;margin-bottom:8px;font:500 1rem Inter,system-ui,sans-serif;cursor:pointer;text-align:left}
.mi.red{color:#f87171}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qs{display:flex;gap:8px;margin-bottom:10px}.qs .in{margin:0;text-align:center;min-width:0}.qs .ib{width:48px;height:48px;font-size:1.4rem;flex:none}
.icp{display:flex;gap:10px;margin-bottom:10px}.ip input{display:none}
.ip span{width:48px;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);display:grid;place-items:center;color:var(--t2);cursor:pointer}
.ip input:checked+span{border-color:var(--p);color:var(--p);background:rgba(139,92,246,.18)}
.empty{text-align:center;color:var(--t2);padding:28px 10px;border:1px dashed var(--bd);border-radius:var(--r);margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--p);color:#fff;padding:10px 18px;border-radius:20px;z-index:30;font-size:.9rem}
</style>
</head>

function card(l){var s=st(l);return '<div class="card lc" data-a="open" data-id="'+l.id+'"><div class="ico">'+I(l.icon||'cart',22)+'</div><div class="fl"><b>'+esc(l.name)+'</b><small>'+s.n+(s.n==1?' produto':' produtos')+'</small><div class="bar"><i style="width:'+s.p+'%"></i></div></div><div class="pc">'+s.p+'%'+I('right',18)+'</div></div>'}
function act(){return D.lists.filter(function(l){return!l.fin})}
function newBtn(){return '<button class="btn" data-a="nl">'+I('plus')+' Nova lista de compras</button>'}
function sc(t,n){return '<div class="sc"><b>'+n+'</b><small>'+t+'</small></div>'}
function vHome(){var a=act(),pen=0;a.forEach(function(l){var s=st(l);pen+=s.n-s.d});
return hd()+'<div class="stats">'+sc('Listas ativas',a.length)+sc('Produtos pendentes',pen)+sc('Compras concluídas',D.lists.length-a.length)+'</div><h2>Suas listas</h2>'+(a.length?a.map(card).join(''):'<div class="empty">Você ainda não tem listas ativas.</div>')+newBtn()}
function vLists(){var a=act();return ttl('Listas')+(a.length?a.map(card).join(''):'<div class="empty">Nenhuma lista cadastrada.</div>')+newBtn()}
function vHist(){var a=D.lists.filter(function(l){return l.fin}).sort(function(x,y){return y.fin-x.fin});
return ttl('Histórico')+(a.length?a.map(function(l){var s=st(l);return '<div class="card col"><div class="rw"><div class="ico">'+I(l.icon||'cart',22)+'</div><div class="fl"><b>'+esc(l.name)+'</b><small>'+new Date(l.fin).toLocaleDateString('pt-BR')+' · '+s.d+' de '+s.n+' produtos comprados</small></div></div><div class="rw" style="margin-top:12px;gap:8px"><button class="pb" data-a="open" data-id="'+l.id+'">Ver produtos</button><button class="pb" data-a="dup" data-id="'+l.id+'">Reutilizar lista</button></div></div>'}).join(''):'<div class="empty">Nenhuma compra finalizada ainda.</div>')}
function vSet(){var r=function(a,i,t){return '<button class="mi" data-a="'+a+'">'+I(i)+t+'</button>'};
return ttl('Ajustes')+r('mc','tag','Gerenciar categorias')+r('ex','dl','Exportar dados')+r('imp','ul','Importar dados')+r('inf','info','Informações do aplicativo')}
function itemsHtml(l){var its=l.items.filter(function(i){return(f=='Todos'||i.cat==f)&&(!q||i.name.toLowerCase().indexOf(q.toLowerCase())>-1)});
return its.length?its.map(function(i){return '<div class="card it'+(i.done?' dn':'')+'"><button class="ck" data-a="tg" data-id="'+i.id+'" aria-label="Marcar">'+(i.done?I('check',16):'')+'</button><div class="em">'+(E[i.cat]||(i.cat?'🏷️':'🛒'))+'</div><div class="fl"><b>'+esc(i.name)+'</b><small>'+qt(i)+(i.cat?' · '+esc(i.cat):'')+'</small>'+(i.note?'<small>'+esc(i.note)+'</small>':'')+'</div><button class="ib" data-a="im" data-id="'+i.id+'">'+I('more')+'</button></div>'}).join(''):'<div class="empty">'+(l.items.length?'Nenhum produto encontrado.':'Nenhum produto ainda. Toque em Adicionar produto.')+'</div>'}
function vList(){var l=gl(route.l);if(!l){route.l=null;return vHome()}var s=st(l);
return '<div class="top"><button class="ib" data-a="back" aria-label="Voltar">'+I('left')+'</button><h1 class="fl">'+esc(l.name)+'</h1><button class="ib" data-a="el" aria-label="Editar lista">'+I('edit')+'</button><button class="ib" data-a="lm" aria-label="Mais opções">'+I('more')+'</button></div>'+(l.desc?'<small style="margin:-8px 0 12px">'+esc(l.desc)+'</small>':'')+'<div class="card col"><b>'+s.d+' de '+s.n+' produtos comprados — '+s.p+'%</b><div class="bar"><i style="width:'+s.p+'%"></i></div></div><input id="sq" class="in" placeholder="Pesquisar produtos" value="'+esc(q)+'"><div class="chips">'+['Todos'].concat(D.cats).map(function(c){return '<button data-a="chip" data-id="'+esc(c)+'"'+(c==f?' class="on"':'')+'>'+esc(c)+'</button>'}).join('')+'</div><div id="its">'+itemsHtml(l)+'</div>'+(l.fin?'':'<button class="btn fab" data-a="ai">'+I('plus')+' Adicionar produto</button>')}
function render(){var h=route.l?vList():route.t=='home'?vHome():route.t=='lists'?vLists():route.t=='hist'?vHist():vSet();$('#app').innerHTML=h;
$('#nav').innerHTML=[['home','Início','home'],['lists','Listas','list'],['hist','Histórico','clock'],['set','Ajustes','set']].map(function(t){return '<button data-a="tab" data-id="'+t[0]+'" class="'+(route.t==t[0]?'on':'')+'">'+I(t[2],22)+'<span>'+t[1]+'</span></button>'}).join('')}
function listForm(id){var l=id?gl(id):null,ic=['cart','pill','home','bag'],cur=l&&l.icon||'cart';
sheet('<h3>'+(l?'Editar lista':'Nova lista')+'</h3><form id="fl" data-id="'+(id||'')+'"><label>Nome da lista</label><input class="in" name="n" required placeholder="Ex.: Supermercado" value="'+esc(l?l.name:'')+'"><label>Ícone</label><div class="icp">'+ic.map(function(k){return '<label class="ip"><input type="radio" name="i" value="'+k+'"'+(cur==k?' checked':'')+'><span>'+I(k,22)+'</span></label>'}).join('')+'</div><label>Categoria (opcional)</label>'+catSel(l?l.cat:'')+'<label>Descrição (opcional)</label><input class="in" name="d" value="'+esc(l?l.desc:'')+'"><button class="btn" type="submit">'+(l?'Salvar':'Criar lista')+'</button></form>')}
function itemForm(id){var l=gl(route.l),i=id?gi(l,id):null;
sheet('<h3>'+(i?'Editar produto':'Adicionar produtos')+'</h3><form id="fi" data-id="'+(id||'')+'"><label>Produto</label><input class="in" name="n" list="sg" required autocomplete="off" value="'+esc(i?i.name:'')+'"><datalist id="sg">'+D.names.map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist><label>Quantidade</label><div class="qs"><button type="button" class="ib" data-a="qm" aria-label="Diminuir">−</button><input class="in" name="q" type="number" inputmode="decimal" min="0.1" step="any" value="'+(i?i.qty:1)+'"><button type="button" class="ib" data-a="qp" aria-label="Aumentar">+</button></div><label>Unidade</label><select class="in" name="u"><option value="">Sem unidade</option>'+UN.map(function(u){return '<option'+(u==(i?i.unit:'Unidade')?' selected':'')+'>'+u+'</option>'}).join('')+'</select><label>Categoria (opcional)</label>'+catSel(i?i.cat:'')+'<label>Observações (opcional)</label><input class="in" name="o" value="'+esc(i?i.note:'')+'"><button class="btn" type="submit">'+(i?'Salvar':'Adicionar')+'</button>'+(i?'':'<button type="button" class="btn ghost" data-a="cs">Concluir</button>')+'</form>')}
function shareText(l){return l.name+'\n'+l.items.map(function(i){return (i.done?'[x] ':'[ ] ')+i.name+' — '+qt(i)}).join('\n')}
function txSheet(t,x,sh){sheet('<h3>'+t+'</h3><textarea id="cpt" class="in" '+(sh?'readonly':'')+'>'+esc(x)+'</textarea><button class="btn" data-a="cp">'+I('copy')+' Copiar</button>'+(navigator.share&&sh?'<button class="btn ghost" data-a="sh">'+I('share')+' Compartilhar</button>':'')+'<button class="btn ghost" data-a="cs">Fechar</button>')}
function catSheet(){sheet('<h3>Categorias</h3>'+D.cats.map(function(c){return '<div class="card it"><div class="fl">'+esc(c)+'</div><button class="ib" data-a="dc" data-id="'+esc(c)+'">'+I('x',18)+'</button></div>'}).join('')+'<form id="fc"><input class="in" name="n" placeholder="Nova categoria" required><button class="btn" type="submit">Adicionar categoria</button></form><button class="btn ghost" data-a="cs">Fechar</button>')}
function dupList(id){var l=gl(id);D.lists.unshift({id:uid(),name:l.name+' (cópia)',icon:l.icon,cat:l.cat,desc:l.desc,fin:null,items:l.items.map(function(i){return{id:uid(),name:i.name,qty:i.qty,unit:i.unit,cat:i.cat,note:i.note,done:false}})});save();route={t:'lists',l:null};render();toast('Lista criada')}
var A={
tab:function(id){route={t:id,l:null};q='';f='Todos';render()},
open:function(id){route.l=id;q='';f='Todos';render();scrollTo(0,0)},
back:function(){route.l=null;render()},
bell:function(){toast('Sem notificações novas')},
nl:function(){listForm()},el:function(){listForm(route.l)},ai:function(){itemForm()},
cs:cs,qm:function(){step(-1)},qp:function(){step(1)},ok:function(){var g=pend;cs();if(g)g()},
chip:function(id){f=id;render()},
tg:function(id){var i=gi(gl(route.l),id);i.done=!i.done;save();render()},
im:function(id){sheet('<h3>'+esc(gi(gl(route.l),id).name)+'</h3><button class="mi" data-a="ei" data-id="'+id+'">'+I('edit')+'Editar</button><button class="mi" data-a="mu" data-id="'+id+'">'+I('up')+'Mover para cima</button><button class="mi" data-a="md" data-id="'+id+'">'+I('down')+'Mover para baixo</button><button class="mi red" data-a="di" data-id="'+id+'">'+I('trash')+'Excluir</button>')},
ei:function(id){itemForm(id)},
mu:function(id){mv(id,-1)},md:function(id){mv(id,1)},
di:function(id){conf('Excluir este produto?',function(){var l=gl(route.l);l.items=l.items.filter(function(i){return i.id!=id});save();render()},'Excluir')},
lm:function(){var l=gl(route.l);sheet('<h3>'+esc(l.name)+'</h3><button class="mi" data-a="all">'+I('check')+'Marcar todos como comprados</button><button class="mi" data-a="none">'+I('x')+'Desmarcar todos</button><button class="mi" data-a="dup" data-id="'+l.id+'">'+I('copy')+'Duplicar lista</button><button class="mi" data-a="shr">'+I('share')+'Compartilhar por texto</button>'+(l.fin?'':'<button class="mi" data-a="fin">'+I('check')+'Finalizar lista</button>')+'<button class="mi red" data-a="dl">'+I('trash')+'Excluir lista</button>')},
all:function(){gl(route.l).items.forEach(function(i){i.done=true});save();cs();render()},
none:function(){gl(route.l).items.forEach(function(i){i.done=false});save();cs();render()},
dup:function(id){cs();dupList(id)},
shr:function(){txSheet('Compartilhar lista',shareText(gl(route.l)),true)},
sh:function(){navigator.share({text:$('#cpt').value}).catch(function(){})},
cp:function(){var t=$('#cpt');t.select();try{navigator.clipboard.writeText(t.value).catch(function(){document.execCommand('copy')})}catch(e){document.execCommand('copy')}toast('Copiado')},
fin:function(){conf('Finalizar esta lista? Ela vai para o Histórico.',function(){gl(route.l).fin=Date.now();save();route={t:'hist',l:null};render()},'Finalizar')},
dl:function(){conf('Excluir esta lista e todos os produtos?',function(){var id=route.l;D.lists=D.lists.filter(function(l){return l.id!=id});save();route.l=null;render()},'Excluir')},
mc:catSheet,
dc:function(id){D.cats=D.cats.filter(function(c){return c!=id});if(f==id)f='Todos';save();catSheet();render()},
ex:function(){txSheet('Exportar dados',JSON.stringify(D),true)},
imp:function(){sheet('<h3>Importar dados</h3><textarea id="imt" class="in" placeholder="Cole aqui os dados exportados"></textarea><button class="btn" data-a="doim">Importar</button><button class="btn ghost" data-a="cs">Cancelar</button>')},
doim:function(){var o;try{o=JSON.parse($('#imt').value);if(!Array.isArray(o.lists))throw 0}catch(e){toast('Dados inválidos');return}
conf('Isso substitui todos os dados atuais. Continuar?',function(){D=o;ens();save();route={t:'home',l:null};render();toast('Dados importados')},'Importar')},
inf:function(){sheet('<h3>Minhas Compras</h3><p style="color:var(--t2)">Seus dados ficam salvos neste aparelho e funcionam sem internet. Use Exportar dados para fazer backup.</p><button class="btn ghost" data-a="cs">Fechar</button>')}
};
function step(d){var x=$('.sh [name=q]');x.value=Math.max(1,(parseFloat(x.value)||1)+d)}
function mv(id,d){var l=gl(route.l),a=l.items,i=a.indexOf(gi(l,id)),j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;save();cs();render()}
document.addEventListener('click',function(e){if(e.target.classList.contains('ov')){cs();return}var el=e.target.closest('[data-a]');if(!el)return;var fn=A[el.dataset.a];if(fn)fn(el.dataset.id)});
document.addEventListener('input',function(e){if(e.target.id=='sq'){q=e.target.value;$('#its').innerHTML=itemsHtml(gl(route.l))}});
document.addEventListener('submit',function(e){e.preventDefault();var F=e.target,E2=F.elements,id=F.dataset.id,n=E2.n.value.trim();if(!n)return;
if(F.id=='fl'){var ic=F.querySelector('[name=i]:checked');var v={name:n,icon:ic?ic.value:'cart',cat:E2.c.value,desc:E2.d.value.trim()};
if(id)Object.assign(gl(id),v);else D.lists.unshift(Object.assign({id:uid(),items:[],fin:null},v));save();cs();render()}
else if(F.id=='fi'){var l=gl(route.l),v2={name:n,qty:parseFloat(E2.q.value)||1,unit:E2.u.value,cat:E2.c.value,note:E2.o.value.trim()};
if(D.names.indexOf(n)<0)D.names.push(n);
if(id){Object.assign(gi(l,id),v2);save();cs();render()}
else{l.items.push(Object.assign({id:uid(),done:false},v2));save();render();E2.n.value='';E2.o.value='';E2.q.value=1;E2.n.focus();toast('Adicionado')}}
else if(F.id=='fc'){if(D.cats.indexOf(n)<0)D.cats.push(n);save();catSheet();render()}});
render();
</script>
</body>
</html>
