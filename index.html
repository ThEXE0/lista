<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Compras</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0e1f;--card:#111733;--card2:#161d40;--text:#e8ebff;--muted:#8e97c4;--accent:#8b5cf6;--accent2:#a78bfa;--line:#242c57;--danger:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:8px 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
form{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);font-size:1rem}
input[type=number]{width:64px;padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);font-size:1rem;text-align:center}
button{cursor:pointer;font:inherit}
.add{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 16px;font-weight:600}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input{width:22px;height:22px;accent-color:var(--accent);flex:none}
li span.n{flex:1;word-break:break-word}
li .q{color:var(--muted);font-size:.85rem}
li.done span.n{text-decoration:line-through;color:var(--muted)}
.del{background:none;border:0;color:var(--danger);font-size:1.3rem;padding:4px 8px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:.9rem}
.link{background:none;border:0;color:var(--accent2);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>🛒 Lista de Compras</h1>
  <div class="sub" id="count"></div>
  <form id="f">
    <input type="text" id="name" placeholder="Adicionar item…" autocomplete="off" required>
    <input type="number" id="qty" value="1" min="1" aria-label="Quantidade">
    <button class="add" type="submit">+</button>
  </form>
  <ul id="list"></ul>
  <div class="bar">
    <button class="link" id="clear">Limpar comprados</button>
    <button class="link" id="reset">Apagar tudo</button>
  </div>
</main>
<script>
var items=[];
try{items=JSON.parse(localStorage.getItem("lc-items")||"[]")}catch(e){items=[]}
function save(){try{localStorage.setItem("lc-items",JSON.stringify(items))}catch(e){}}
function render(){
  var ul=document.getElementById("list");ul.innerHTML="";
  if(!items.length){ul.innerHTML='<div class="empty">Sua lista está vazia.</div>'}
  items.forEach(function(it,i){
    var li=document.createElement("li");if(it.done)li.className="done";
    var cb=document.createElement("input");cb.type="checkbox";cb.checked=it.done;
    cb.onchange=function(){it.done=cb.checked;save();render()};
    var n=document.createElement("span");n.className="n";n.textContent=it.name;
    var q=document.createElement("span");q.className="q";q.textContent="×"+it.qty;
    var d=document.createElement("button");d.className="del";d.textContent="×";d.setAttribute("aria-label","Remover");
    d.onclick=function(){items.splice(i,1);save();render()};
    li.append(cb,n,q,d);ul.appendChild(li);
  });
  var left=items.filter(function(x){return!x.done}).length;
  document.getElementById("count").textContent=items.length?left+" de "+items.length+" itens pendentes":"";
}
document.getElementById("f").onsubmit=function(e){
  e.preventDefault();
  var n=document.getElementById("name"),q=document.getElementById("qty");
  var v=n.value.trim();if(!v)return;
  items.unshift({name:v,qty:Math.max(1,parseInt(q.value)||1),done:false});
  n.value="";q.value=1;save();render();n.focus();
};
document.getElementById("clear").onclick=function(){items=items.filter(function(x){return!x.done});save();render()};
var rb=document.getElementById("reset"),rt=null;
rb.onclick=function(){
  if(!items.length)return;
  if(rb.dataset.sure){clearTimeout(rt);delete rb.dataset.sure;rb.textContent="Apagar tudo";items=[];save();render();return}
  rb.dataset.sure=1;rb.textContent="Toque de novo para confirmar";
  rt=setTimeout(function(){delete rb.dataset.sure;rb.textContent="Apagar tudo"},3000);
};
render();
</script>
</body>
</html>
